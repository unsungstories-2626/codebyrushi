<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — CodeByRushi</title>
<meta name="description" content="Get in touch with CodeByRushi.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="dot"></span>codebyrushi</a>
    <button class="nav-toggle" aria-expanded="false">menu</button>
    <nav class="primary-nav">
      <a href="index.html">notes</a>
      <a href="about.html">about</a>
      <a href="contact.html" class="is-active">contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <p class="prompt-line"><span class="sym">&gt;</span>~/codebyrushi $ cat contact.md</p>
      <h1>Get in touch</h1>
      <p class="lede">Questions, corrections, or topic requests — all welcome. Replace the email below with your own.</p>
    </div>

    <p style="font-family:'IBM Plex Mono',monospace; font-size:.95rem; margin-bottom:36px;">
      <a href="mailto:hello@codebyrushi.com">hello@codebyrushi.com</a>
    </p>

    <form id="contact-form">
      <div class="field-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="btn">Send message</button>
      <p id="form-note" class="article-meta" style="margin-top:14px;"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 CodeByRushi</span>
    <nav>
      <a href="about.html">about</a>
      <a href="privacy.html">privacy</a>
      <a href="contact.html">contact</a>
    </nav>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
